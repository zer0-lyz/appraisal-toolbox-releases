<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>评估工具箱</title>
    <link rel="stylesheet" href="../styles/shell.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand-block">
          <button id="goHome" type="button" class="brand-button">评估工具箱</button>
          <p id="subtitle">首页</p>
        </div>
      </header>

      <section id="status" class="status status-idle" role="status" aria-live="polite">正在加载功能模块…</section>

      <section id="page-home" class="route-page" data-route="home">
        <div class="page-heading">
          <div>
            <h2>功能模块</h2>
            <p>选择一个功能开始处理</p>
          </div>
          <span id="moduleCountBadge" class="badge">6 个业务工具</span>
        </div>
        <div class="module-sections">
          <section class="module-section" aria-labelledby="moduleSectionTitle">
            <div class="module-section-heading">
              <h3 id="moduleSectionTitle">业务工具</h3>
              <small>数据采集、文档处理与测算功能</small>
            </div>
            <div class="module-grid">
              <button id="openLandPublicity" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M9.3 3.9 4 5.9v14.2l5.3-2 5.4 2 5.3-2V3.9l-5.3 2z"></path>
                    <path class="icon-knockout" d="M9.3 3.9v14.2m5.4-12.2v14.2"></path>
                    <path class="icon-stroke" d="M6.6 9.1h2M15.9 11h2.1"></path>
                  </svg>
                </span>
                <strong>浙江土地市场网</strong>
                <small>按行政区、用途和价格面积筛选并生成地图结果</small>
                <small class="module-health" id="landPublicityHealth" hidden></small>
              </button>
              <button id="openAlibabaAuction" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M11.4 4.9a1.6 1.6 0 0 1 2.3 0l5.4 5.4a1.6 1.6 0 0 1 0 2.3l-1.4 1.4-7.7-7.7z"></path>
                    <path class="icon-stroke" d="m9.9 10.1-6 6a1.9 1.9 0 0 0 2.7 2.7l6-6m1.4 7.6h6.4"></path>
                  </svg>
                </span>
                <strong>阿里司法拍卖</strong>
                <small>登录后自动读取列表并核验成交详情</small>
              </button>
              <button id="openAlibabaLease" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M4.4 20.6V6.7L11 4.4v16.2z"></path>
                    <path class="icon-fill" d="M12.4 20.6V9.9h7.2v10.7z"></path>
                    <path class="icon-knockout" d="M6.7 8.4h2m-2 3.6h2m-2 3.6h2m5.7-4.1h2.4m-2.4 3.5h2.4"></path>
                    <path class="icon-stroke" d="M3 20.6h18"></path>
                  </svg>
                </span>
                <strong>阿里资产租赁</strong>
                <small>抓取使用权出租案例并核验首年租金与租期</small>
              </button>
              <button id="openTableFormat" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M4.5 4.5h15v15h-15z"></path>
                    <path class="icon-knockout" d="M4.5 8.3h15M4.5 12h15M9.2 4.5v15"></path>
                  </svg>
                </span>
                <strong>表格设置</strong>
                <small>批量统一 Word 文档中所有表格的格式</small>
              </button>
              <button id="openAnjukeProperty" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M12 3.9 4.2 10.5v9.6h6v-5.3h3.6v5.3h6v-9.6z"></path>
                    <circle class="icon-stroke" cx="15.3" cy="14.6" r="3"></circle>
                    <path class="icon-stroke" d="m17.5 16.8 2.8 2.8"></path>
                  </svg>
                </span>
                <strong>安居客数据</strong>
                <small>抓取物业出售、租赁案例并保存原始证据</small>
              </button>
              <button id="openDepreciationCapex" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M4.5 19.5h15a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5h-15A1.5 1.5 0 0 0 3 6v12a1.5 1.5 0 0 0 1.5 1.5"></path>
                    <path class="icon-knockout" d="M6.75 16.5h1.5v-3h-1.5zm4.5 0h1.5V9h-1.5zm4.5 0h1.5v-5.25h-1.5z"></path>
                    <path class="icon-stroke" d="M21 4.5H3a.75.75 0 0 0-.75.75V18A1.5 1.5 0 0 0 3.75 19.5h16.5a1.5 1.5 0 0 0 1.5-1.5V5.25A.75.75 0 0 0 21 4.5m-.75 13.5H3.75V6h16.5z"></path>
                  </svg>
                </span>
                <strong>折旧摊销与资本性支出预测</strong>
                <small>设置参数、录入资产并运行长周期折旧摊销预测</small>
              </button>
            </div>
          </section>
          <section class="module-section" aria-labelledby="moduleSectionUtilityTitle">
            <div class="module-section-heading">
              <h3 id="moduleSectionUtilityTitle">辅助配置</h3>
              <small>运行依赖与版本管理入口</small>
            </div>
            <div class="module-grid">
              <button id="openMapSettings" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path class="icon-fill" d="M9.3 3.9 4 5.9v14.2l5.3-2 5.4 2 5.3-2V3.9l-5.3 2z"></path>
                    <path class="icon-knockout" d="M9.3 3.9v14.2m5.4-12.2v14.2"></path>
                    <circle class="icon-knockout" cx="12" cy="11.2" r="1.6"></circle>
                  </svg>
                </span>
                <strong>地图基础配置</strong>
                <small>配置高德地图密钥，供土地与案例结果页生成地图</small>
              </button>
              <button id="openUpdatesTop" type="button" class="module-card">
                <span class="module-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <circle class="icon-fill" cx="12" cy="12.8" r="7.2"></circle>
                    <path class="icon-knockout" d="M12 9v4l2.6 2"></path>
                    <path class="icon-stroke" d="M9.2 3.4h5.6M12 3.4v2.2"></path>
                  </svg>
                </span>
                <strong>版本更新</strong>
                <small>检查工具箱新版本并通过发布页下载安装</small>
              </button>
            </div>
          </section>
        </div>
      </section>

      <section id="page-land-publicity" class="route-page hidden" data-route="land-publicity"></section>
      <section id="page-alibaba-auction" class="route-page hidden" data-route="alibaba-auction"></section>
      <section id="page-alibaba-lease" class="route-page hidden" data-route="alibaba-lease"></section>
      <section id="page-anjuke-property" class="route-page hidden" data-route="anjuke-property"></section>
      <section id="page-table-format" class="route-page hidden" data-route="table-format"></section>
      <section id="page-map-settings" class="route-page hidden" data-route="map-settings"></section>
      <section id="page-updates" class="route-page hidden" data-route="updates"></section>
      <section id="page-depreciation-capex-forecast" class="route-page hidden" data-route="depreciation-capex-forecast"></section>
    </main>
    <script type="module" src="./shell.js"></script>
  </body>
</html>
